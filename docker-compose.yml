# Базується на docker-compose з лабораторної роботи 4.
# Додано сервіс app: веб-додаток (Python, Bottle, SQLAlchemy, uWSGI).

services:

  memcached:
    image: memcached:latest
    ports:
      - 11212:11211


  postgres_db:
    build:
      context: .
      dockerfile: pg-Dockerfile

    # адреса memcached для розширення pgmemcache
    command: postgres -c pgmemcache.default_servers=memcached

    environment:   # користувач і пароль бази даних
      POSTGRES_PASSWORD: password
      POSTGRES_USER: root

    ports:         # база доступна з комп'ютера на порту 8432
      - 8432:5432

    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      # усі файли з цієї папки виконуються при першому старті бази в алфавітному порядку
      - ./postgres/init:/docker-entrypoint-initdb.d
      - ./postgres/scripts:/pg

    depends_on:
      - memcached


  app:
    build:
      context: ./app
      dockerfile: Dockerfile

    environment:
      # рядок підключення SQLAlchemy: користувач:пароль@сервіс:порт/база
      DATABASE_URL: postgresql+psycopg2://root:password@postgres_db:5432/hotel

    expose:        # порт uWSGI видно лише іншим контейнерам (nginx)
      - "8085"

    depends_on:
      - postgres_db


  adminer:
    image: adminer
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres_db
    depends_on:
      - postgres_db


  nginx:
    build:
      context: ./nginx
      dockerfile: nginx-Dockerfile
    ports:
      - 8088:80      # веб-додаток
      - 8089:8089    # REST-доступ до кешу (лабораторна робота 4)
    volumes:
      - ./nginx/logs:/etc/logs/nginx
    depends_on:
      - app
      - memcached
