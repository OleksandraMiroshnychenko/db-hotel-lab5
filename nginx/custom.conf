# Сервер 1 (порт 80 у контейнері, 8088 на комп'ютері): веб-додаток.
# nginx передає запити uWSGI-серверу, який запускає Bottle-додаток (контейнер app).
server {
    listen 80;

    location / {
        include uwsgi_params;
        uwsgi_pass app:8085;
    }
}

# Сервер 2 (порт 8089): REST-доступ до кешу з лабораторної роботи 4.
# Ключем у memcached служить адреса запиту; до бази даних nginx не звертається.
server {
    listen 8089;

    location / {
        set $memcached_key "$uri";
        memcached_pass memcached:11211;
        default_type application/json;
        add_header x-header-memcached true;
    }
}
